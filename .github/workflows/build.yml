# Mac・Windows・Linux 向けを組み立てて、リリースに添付する（公証・署名なし）
#   ・main に入ったとき：src-tauri/tauri.conf.json の version のリリース（v0.1.0 など）がまだなければ作って添付
#   ・PR・手動：組み立てだけ行い、Actions に保存
name: Build

on:
  push:
    branches: [main]
    paths:
      - src/**
      - src-tauri/**
      - package.json
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$v" >/dev/null 2>&1; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux の部品
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check.outputs.release == 'true' && needs.check.outputs.tag || '' }}
          releaseName: 'Distill Local Dedupe ${{ needs.check.outputs.tag }}'
          releaseBody: 'Mac は .dmg（または .app.tar.gz）、Windows は .msi / .exe、Linux は .AppImage / .deb を使ってください。公証・署名をしていないため、初回は OS の確認が出ます（README 参照）。'
          releaseDraft: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ needs.check.outputs.release != 'true' }}
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
