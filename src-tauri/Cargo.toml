[package]
name = "distill-local-dedupe"
version = "0.1.0"
description = "Distill Local Dedupe"
authors = ["Noel Labs"]
license = "MIT"
edition = "2021"

[lib]
name = "distill_local_dedupe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
trash = "5"
